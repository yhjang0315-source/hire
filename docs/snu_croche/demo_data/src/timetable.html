<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><title>시간표</title>
<style>
body { background: #fff; }
.tt { width: 420px; padding: 14px; font-size: 12px; }
.tt h3 { font-size: 16px; margin-bottom: 2px; }
.tt .s { color: #7a8394; font-size: 12px; margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: 26px repeat(5, 1fr); gap: 2px; }
.dh { text-align: center; color: #5b6475; font-weight: 600; padding-bottom: 4px; }
.hours { position: relative; height: 486px; }
.hours span { position: absolute; right: 4px; color: #9aa2b1; font-size: 10px; transform: translateY(-50%); }
.day { position: relative; height: 486px; background: repeating-linear-gradient(#fff 0, #fff 53px, #edf0f5 53px, #edf0f5 54px); border-radius: 4px; }
.c { position: absolute; left: 2px; right: 2px; border-radius: 5px; padding: 4px 5px; color: #fff; font-size: 11px; line-height: 1.3; font-weight: 600; }
.c small { display: block; font-weight: 400; opacity: .9; font-size: 10px; }
.online { margin-top: 10px; background: #f5f7fb; border-radius: 6px; padding: 8px 10px; }
</style></head><body>

    <div class="day"><div class="c" style="top:54px;height:81px;background:#e0832a">자료구조<small>10:00–11:30 · 공학관 404</small></div><div class="c" style="top:162px;height:81px;background:#d0702a">자료구조 실습<small>12:00–13:30 · 실습실 2</small></div></div>

</div></body></html>
